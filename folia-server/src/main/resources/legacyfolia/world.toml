# ============================================================================
#  LegacyFolia
# ============================================================================
#
#  Settings are grouped by what they do, not by which server this fork
#  inherited them from. Every one of them is commented.
#
#  When you upgrade, new settings appear here with their comments and your own
#  edits are left untouched.
#
#  Documentation: https://github.com/adrielorihuela/LegacyFolia
# ============================================================================

# ----------------------------------------------------------------------------
#  Dimensions - which worlds the server creates at all
# ----------------------------------------------------------------------------
#  Turning a dimension off means it is never created: no world folder, no
#  chunks in memory, no entities ticking, no region threads spent on it. On a
#  lobby or a minigame server that never uses the Nether or the End, this is
#  the cheapest performance setting there is.
#
#  Turning one off later does not delete a world folder that already exists;
#  it just stops loading it. Turning it back on picks up where it left off.
[dimensions]

# The main world. Cannot be turned off - the server has nowhere to put players
# without it, so setting this to false is refused and logged at start-up.
overworld = true

# The Nether, stored in world/dimensions/minecraft/the_nether.
# Off means nether portals do nothing when entered.
nether = true

# The End, stored in world/dimensions/minecraft/the_end.
# Off means end portals do nothing when entered, and the ender dragon fight
# never exists.
end = true

# ----------------------------------------------------------------------------
#  World - how players arrive in it and where they may build
# ----------------------------------------------------------------------------
[world]

# Put every joining player at the world spawn, as if it were their first join.
#
# Useful for a lobby, where there is one place people are meant to arrive at.
# With this off the server puts a returning player back exactly where they
# logged out, which on a lobby means reappearing halfway up a build or in a
# corner the map never meant to start anyone in.
#
# The spawn radius is respected, so arrivals are spread out the same way a
# first join is.
#
# Nothing is deleted. The position saved for the player is simply not read
# when deciding where to put them - inventory, ender chest, experience,
# health, advancements and statistics are all kept as they are. Turning this
# back off restores the normal behaviour on the very next join, because that
# saved position was never touched.
always-spawn-at-world-spawn = false

# Which world's spawn always-spawn-at-world-spawn sends a player to.
#
#   logout-world - the spawn of the world they logged out in, so somebody who
#                  left from the Nether arrives at the Nether's spawn
#   main-world   - the spawn of the main world (level-name in server.toml),
#                  whichever world they left from, which is what a lobby with
#                  several worlds wants
#
# Only read while always-spawn-at-world-spawn is on.
lobby-spawn-world = "logout-world"

# Stop players building on top of the Nether roof.
#
# The Nether is really 256 blocks tall; its logical height of 128 only limits
# where portals may lead. That means the bedrock roof at y=127 is reachable
# and the flat expanse above it is buildable, which turns it into a fast
# travel plane above the whole dimension.
#
# On, blocks may not be placed above y=127 in the Nether. Nothing else
# changes: the dimension keeps its real height, so chunks, generation and
# heightmaps are untouched, and no other world is affected.
#
# Turning this off allows building up there again immediately. Blocks already
# placed above the roof are left exactly where they are either way.
disable-nether-roof = false

# Write every per-world setting of this world to the console as the world
# loads, the way spigot.yml's verbose did. PER WORLD.
#
# Useful when checking that an override in worlds.toml is reaching the world
# it was written for; noise the rest of the time.
log-settings-on-load = false

# ----------------------------------------------------------------------------
#  Generation - what a world is made of, the first time it is made
# ----------------------------------------------------------------------------
#  Almost everything here is read when a world is created and then written into
#  that world's own data. Changing it afterwards does not regenerate anything:
#  the existing chunks stay as they are, and only chunks generated from that
#  point on would follow a new setting, which is how you get a visible seam in
#  the terrain. Treat this section as the settings for a new save.
[world.generation]

# The seed the world is generated from. Empty picks a random one and records it
# in the world data, so an empty value here does not mean the world changes
# each start.
#
# A value that parses as a number is used as that number; anything else is
# hashed to one, which is why "12345" and "hello" are both valid. Only the main
# world reads this; the Nether and the End derive theirs from it.
level-seed = ""

# The generator: minecraft:normal, minecraft:flat, minecraft:large_biomes,
# minecraft:amplified, minecraft:single_biome_surface, or an id a datapack
# provides. Bare vanilla names without the namespace still work.
level-type = "minecraft:normal"

# Extra JSON for the generator above, and the only way to configure a flat
# world's layers from here. Empty means the preset's own defaults; it is
# ignored entirely by generators that take no settings.
generator-settings = ""

# Generate villages, temples, strongholds, ocean monuments, mineshafts and the
# rest. Off leaves the terrain and its ores intact but strips every structure,
# including the strongholds that hold the end portals, which makes the End
# unreachable without commands.
generate-structures = true

# The radius, in blocks, of the world border a new world starts with. The
# maximum is 29999984, which is where vanilla's own coordinate handling stops
# being reliable; larger values are clamped down to it.
#
# This is only the starting border. /worldborder and any plugin that moves the
# border override it, and the border a world already has is stored in its own
# data rather than read from here.
max-world-size = 29999984

# Extend chunks generated before 1.18 down into the new negative height when
# they are next loaded.
#
# Chunks written by an older version stop at y=0. On, the server generates the
# deepslate and the deepslate ores below them, so old and new terrain line up.
# Off, those chunks keep a flat bedrock floor at y=0 and there is a visible wall
# wherever old meets new.
#
# This is a one-way conversion, done once per chunk as it is loaded, so turning
# it off later does not undo the chunks already extended. A world that has
# never been opened by an older version has nothing to convert and is not
# affected either way.
#
# There used to be two of these with the same name: a global one that Spigot
# read from world-settings.default despite it not being a default, and a real
# per-world one. Both were consulted at the same place in the code, whichever
# happened to be reachable. It is one setting here, for every world.
below-zero-generation-in-existing-chunks = true

# Give every placed feature (trees, ores, flowers, lakes...) a random seed of
# its own instead of deriving it from the world seed. PER WORLD.
#
# Two worlds with the same seed then no longer have the same ore and tree
# placement, which is what makes seed-cracking tools useless for finding
# diamonds. It changes only chunks generated from then on: an existing world
# gets a visible change in vegetation along the border of what was there.
random-feature-seeds = false

# ----------------------------------------------------------------------------
#  Structure seeds - where structures are placed
# ----------------------------------------------------------------------------
#  Each structure set is spread over the world by a number of its own, mixed
#  with the world seed. The values below are vanilla's. Change one and that
#  structure turns up somewhere else than a seed map says it should, which is
#  the point on a server where players would otherwise look up every village
#  and stronghold from the seed.
#
#  Like the rest of generation, a change applies only to chunks generated from
#  then on. Every key in this section is PER WORLD: each world may hide its
#  structures differently, in worlds.toml.
#
#  These were spigot.yml's per-world seed-* keys. They live here, as one
#  section of world.toml, and not as a table in worlds.toml, because they are
#  ordinary per-world settings: every world reads them, the defaults below are
#  what every world gets, and a world that differs says so in worlds.toml like
#  any other setting.
[world.structure-seeds]

villages = 10387312
desert-pyramids = 14357617
igloos = 14357618
jungle-temples = 14357619
swamp-huts = 14357620
ocean-monuments = 10387313
shipwrecks = 165745295
ocean-ruins = 14357621
pillager-outposts = 165745296
end-cities = 10387313
nether-complexes = 30084232
woodland-mansions = 10387319
nether-fossils = 14357921
ruined-portals = 34222645
ancient-cities = 20083232
trail-ruins = 83469867
trial-chambers = 94251327
abandoned-camps = 91231127
buried-treasure = 10387320

# Mineshafts and strongholds are placed differently from the rest, so their
# default is not a number but "default", which keeps vanilla's placement.
# Write a number in quotes to override it; the stronghold one may be a number
# as large as a world seed.
mineshafts = "default"
strongholds = "default"

# The seed slime chunks are chosen with. Changing it moves every slime chunk,
# so existing slime farms stop working.
slime-chunks = 987234911

# ----------------------------------------------------------------------------
#  Storage - where worlds live on disk, and how they are written
# ----------------------------------------------------------------------------
[world.storage]

# The folder world directories are created and looked for in, relative to the
# server directory. "." is beside the jar, which is where every world already
# is; a value like "worlds" is what a panel usually wants.
#
# This is resolved very early, before most of the server exists, and it is
# overridden entirely by the --universe command line option when that is given.
# Moving it does not move the folders: the server will create fresh empty
# worlds at the new location and leave the old ones untouched.
world-container = "."

# The compression applied to region files lives in performance.toml, under
# [chunks], next to the region file cache and the chunk I/O threads it shares
# its cost with. It is not repeated here.

# Wait for the operating system to confirm each chunk write before carrying on.
#
# On is safe against a power cut at the price of stalling on every save, and it
# is what vanilla does. Note that on this server it is an AND, not a switch:
# the Paper.enable-sync-chunk-writes system property must also be set, so
# leaving this on does not by itself slow anything down. That was deliberate
# upstream, and it means the effective default is off unless you pass the flag.
sync-chunk-writes = true

# ----------------------------------------------------------------------------
#  Generators - handing a world's terrain to a plugin
# ----------------------------------------------------------------------------
#  One entry per world, naming the plugin that generates it, in the form the
#  plugin documents: "PluginName" on its own, or "PluginName:argument" when the
#  plugin offers more than one generator.
#
#  The plugin must be loaded before the world is: a generator named here whose
#  plugin is missing, or is not set to load at startup, is an error at start-up
#  and the world is created with normal terrain instead - which is not something
#  you can undo by fixing the plugin afterwards.
#
#  Empty by default: every world generates with the settings above.
[world.generators]
# world = "MyGeneratorPlugin:archipelago"

# ----------------------------------------------------------------------------
#  Biome providers - handing a world's biomes to a plugin
# ----------------------------------------------------------------------------
#  The same as the generators above, for the biomes alone: the terrain stays
#  the world's own and the plugin decides which biome is where. One entry per
#  world, "PluginName" or "PluginName:argument", and the plugin must load at
#  start-up, before the world.
#
#  Empty by default.
[world.biome-providers]
# world = "MyBiomePlugin"
